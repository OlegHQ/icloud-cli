[package]
name = "icloud-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for iCloud Reminders, Notes, and Hide My Email"

[[bin]]
name = "icloud"
path = "src/main.rs"

[dependencies]
chrono = "0.4.44"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
icloud-api = { path = "../icloud-api" }
icloud-bash = { path = "../icloud-bash" }
bashbox = { git = "https://github.com/OlegHQ/bashbox", rev = "204b7d7223ddb4736e2930221844d6738cf42d9e" }
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
