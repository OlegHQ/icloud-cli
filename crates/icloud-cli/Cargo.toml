[package]
name = "icloud-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust CLI for iCloud Reminders, Notes, Hide My Email, and an automation-friendly virtual filesystem"

[[bin]]
name = "icloud"
path = "src/main.rs"

[dependencies]
chrono = "0.4.44"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
icloud-api = { path = "../icloud-api" }
icloud-bash = { path = "../icloud-bash" }
bashbox = { git = "https://github.com/OlegHQ/bashbox", rev = "ee1080a509aeb5e09e084c998a318a6976247f13" }
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
rpassword = "7"
rustyline = "15"
shell-words = "1"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
