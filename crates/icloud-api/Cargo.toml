[package]
name = "icloud-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "iCloud private web API client (Reminders, Notes, Hide My Email)"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cookie_store = "0.21"
directories = "6"
flate2 = "1"
fs2 = "0.4"
hex = "0.4"
keyring = "3"
hmac = "0.12"
num-bigint = "0.4"
num-traits = "0.2"
pbkdf2 = "0.12"
rand = "0.8"
redb = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls-native-roots"] }
reqwest_cookie_store = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
