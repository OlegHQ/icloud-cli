# Vendored from https://github.com/arthur-zhang/just-bash @ 2a8f50e763511ae50a746eae4d0ee024f848ecd3
# Local patches: pathname globs use SyncFsAdapter::glob (not the host FS); ls/cat builtins.
[package]
name = "just-bash"
version = "0.1.0"
edition = "2021"

[features]
default = []
cli = ["dep:clap"]
sandbox = []

[lib]
name = "just_bash"
path = "src/lib.rs"

[[bin]]
name = "just-bash"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
thiserror = "1.0"
regex-lite = "0.1"
chrono = "0.4"
rand = "0.8"
libc = "0.2"
glob = "0.3"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "sync", "macros"] }
async-trait = "0.1"
clap = { version = "4.4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
base64 = "0.22"
hex = "0.4"
digest = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
similar = "2.6"
jaq-all = "0.1"
htmd = "0.5"
url = "2"
http = "1"
brush-parser = "0.3"
sprintf = "0.4"
awk-rs = "0.1"
sed-rs = "1.0.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
